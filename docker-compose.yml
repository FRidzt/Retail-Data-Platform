version: "3.9"

services:

  postgres:

    image: postgres:16

    container_name: retail-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: retail_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retail_dw"]
      interval: 10s
      timeout: 5s
      retries: 5